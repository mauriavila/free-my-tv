# Builds Free My TV for Fire TV (Fire OS 6+, Android 7.1+) and publishes it as the "firetv" release.
# No TMDB key in the build (this repository is public): see firetv/README.md.
name: Fire TV build

on:
  push:
    branches: [firetv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firetv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK pieces
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34" >/dev/null

      # The same signing key every time, so updates install over the app (adb install -r).
      - name: Signing key (repository secret, else cached)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FIRETV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > freemytv.keystore; echo "from=secret" >> "$GITHUB_OUTPUT"; fi

      - name: Cached signing key
        if: steps.key.outputs.from != 'secret'
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: firetv-keystore-v1

      - name: Build
        run: |
          cp firetv/firetv.properties config.properties
          MIN_SDK=25 ./build.sh 2>&1 | tee build.log
          test -f FreeMyTV.apk
          mv FreeMyTV.apk FreeMyTV-firetv.apk

      - name: Publish the "firetv" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build.log"
          [ -f FreeMyTV-firetv.apk ] && files="FreeMyTV-firetv.apk build.log"
          status="${{ job.status }}"
          notes="Fire TV build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)): $status. Install: adb install -r FreeMyTV-firetv.apk"
          if gh release view firetv >/dev/null 2>&1; then
            gh release edit firetv --notes "$notes" --target "$GITHUB_SHA"
            gh release upload firetv $files --clobber
          else
            gh release create firetv $files --title "Fire TV" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          fi
